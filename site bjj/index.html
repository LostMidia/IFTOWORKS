        <h2>Pricipais nomes do bjj</h2>
        <figure class="conteiner-image">
            <img src="img/Mica Galvão.jpg" width="100"
            alt="A imagem mostra Mica Galvão com as medalhas de ouro dos quatro principais torneios da IBJJF (Europeu, Pan, Brasileiro e Mundial).   O registo foi feito no Mundial da IBJJF de 2024, quando o atleta celebrou a conquista do Super Grand Slam.">
        </figure>
        <figcaption class="informacoes-imagem">
            <h3>Micael Galvão</h3>
            <p>Micael "Mica" Galvão: Prodígio da nova geração e maior fenômeno atual do BJJ. Tornou-se o atleta mais jovem a conquistar o Super Grand Slam e o ouro no ADCC, destacando-se por seu estilo extremamente dinâmico, agressivo e finalizador.</p>
        </figcaption>

        <figure class="conteiner-image">
            <img src="img/Marcus Buchecha.jpg"
            width="100"
            alt="A imagem registra o momento exato da vitória de Marcus 'Buchecha' Almeida na final do absoluto (categoria sem limite de peso) do Campeonato Mundial da IBJJF de 2016.
            Ele derrotou o atleta Erberth Santos na grande final. Com esse resultado, Buchecha conquistou o seu quarto título mundial absoluto na faixa-preta (já havia vencido em 2012, 2013 e 2014), superando o recorde histórico que pertencia a Roger Gracie e tornando-se, naquele momento, o maior campeão absoluto da história do evento.">
        </figure>
        <figcaption class="informacoes-imagem">
            <h3>Marcus bochecha</h3>
            <p>Marcus "Buchecha" Almeida: O maior vencedor da história do Campeonato Mundial da IBJJF na faixa-preta. Com 13 títulos mundiais (sendo 6 no absoluto), marcou época pela combinação incomparável de atleticismo, velocidade e pressão posicional.</p>
        </figcaption>
        <figure class="conteiner-image">
            <img src="img/Roger Gracie.jpg"
            width="100"
            alt="A imagem regista a entrada de Roger Gracie na Arena Carioca 1 para a luta principal do Gracie Pro 2017.
            Ele enfrentou Marcus 'Buchecha' Almeida numa desforra histórica. Não era o seu primeiro título (já somava 10 Mundiais da IBJJF e 2 do ADCC), mas foi a luta de despedida e aposentadoria de Roger Gracie do Jiu-Jitsu competitivo. Roger venceu o combate por finalização (estrangulamento pelas costas), encerrando a sua carreira de forma épica contra o campeão da geração seguinte.">
            <figcaption class="informacoes-imagem">
                <h3>Roger Gracie</h3>
                <p>Roger Gracie: A maior lenda da era moderna do Jiu-Jitsu de quimono. Deca-campeão mundial na faixa-preta na categoria adulto, é reconhecido mundialmente pela eficiência e precisão cirúrgica de seu jogo clássico e finalizador.</p>
            
            </figcaption>
        </figure>
