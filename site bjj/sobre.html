        <h2>A história do Jiu-Jitsu Brasileiro</h2>
         <figure class="conteiner-image">
            <img src="img/jigoro kano.jpg"
            width="100">
            <figcaption class="informacoes-imagem">
                <h3>Origens orientais</h3>
                <p>
                    As raízes da modalidade remontam ao Japão feudal, onde os samurais desenvolveram métodos de combate corpo a corpo sem armas para situações em que perdiam as suas espadas no campo de batalha. Como as armaduras da época tornavam os socos e chutes ineficientes, o foco principal tornou-se as projeções, chaves articulares e estrangulamentos. Já no final do século XIX, o mestre Jigoro Kano aperfeiçoou e reorganizou estes estilos tradicionais ao criar o Judô (na altura também conhecido como Kano Jiu-Jitsu), enfatizando a eficiência prática, a segurança e a aplicação das técnicas em combates reais e contínuos.</p>
            </figcaption>
         </figure>
         <figure class="conteiner-image">
            <img src="img/The real Carlos Gracie.jpg"
            width="100">
            <figcaption class="informacoes-imagem">
                <h3>Chegada ao Brasil</h3>
                <p>Em 1914, o mestre japonês Mitsuyo Maeda, popularmente conhecido como "Conde Koma", desembarcou no Brasil como parte de uma missão para difundir a cultura e a arte marcial do seu país. Após viajar por vários estados, fixou residência em Belém do Pará por volta de 1917, onde conheceu o diplomata Gastão Gracie. Em sinal de gratidão pelo apoio recebido para se estabelecer na região, Maeda começou a ensinar os segredos do Jiu-Jitsu tradicional japonês ao filho mais velho de Gastão, Carlos Gracie.</p>
            </figcaption>
            <figure class="conteiner-image">
            <img src="img/Hélio Gracie em 1952.jpg"
            width="100">
            <figcaption class="informacoes-imagem">
                <h3>Adaptação Gracie</h3>
                <p>Carlos Gracie transmitiu os ensinamentos adquiridos aos seus irmãos, com destaque para Hélio Gracie. Por possuir uma constituição física franzina e uma saúde delicada que o impedia de aplicar a força bruta exigida em certas projeções tradicionais, Hélio adaptou radicalmente as técnicas. Ele aprimorou o uso das alavancas, a distribuição de peso e o controle posicional no solo para neutralizar a vantagem física dos adversários. Juntos, os irmãos abriram a primeira Academia Gracie no Rio de Janeiro em 1925 e provaram a eficácia do seu estilo através dos famosos "Desafios Gracie".</p>
            </figcaption>
            <figure class="conteiner-image">
            <img src="img/Royce Gracie once said, “Talented people without discipline don’t go anywhere_” It’s the ones who show up day after day and put in the work, on the mats who earn their stripes.__Life doesn’t slow down, especially between work.jpg"
            width="100">
            <figcaption class="informacoes-imagem">
                <h3>Impacto Global e UFC</h3>
                <p>O ponto de viragem definitivo para a projeção internacional da arte suave aconteceu em novembro de 1993, nos Estados Unidos. Rorion Gracie co-criou o Ultimate Fighting Championship (UFC 1) para confrontar diferentes modalidades num torneio de artes marciais sem divisão de peso. Representando a família, o jovem Royce Gracie surpreendeu o mundo ao derrotar adversários consideravelmente maiores e mais fortes provenientes do boxe, wrestling e kickboxing. Ao vencer três das primeiras quatro edições do evento usando apenas o Jiu-Jitsu, Royce provou a supremacia do combate no solo e revolucionou para sempre o cenário das lutas.</p>
            </figcaption>
            <figure class="conteiner-image">
            <img src="img/mica Galvão 2.jpg"
            width="100">
            <figcaption class="informacoes-imagem">
                <h3>O jiu-jítsu Moderno</h3>
                <p>Na atualidade, o Jiu-Jitsu Brasileiro consolidou-se como um desporto global e num pilar indispensável para qualquer praticante de artes marciais mistas (MMA). A modalidade expandiu-se em duas vertentes principais: o Gi (com o quimono tradicional, onde as pegadas no pano desempenham um papel tático crucial) e o No-Gi (sem quimono, caracterizado por transições mais rápidas e foco em quedas e chaves de perna). Organizações de prestígio internacional, como a IBJJF e o ADCC, promovem campeonatos mundiais altamente competitivos, mobilizando milhões de atletas e praticantes em todos os continentes.
                </p>
            </figcaption>
