<body>
    <header>
        <h1>O  jiu-jítsu Brasileiro</h1>

        <section class="contact-section">
            <div class="contact-container">
                <h2>Entre em contato conosco</h2>
                <p>Preencha o relatório a seguir</p>
                <form action="#" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Seu email" required>
                    </div>
                    <div class="form-group">
                        <label for="assunto">Assunto</label>
                        <select id="assunto" name="assunto" required>
                            <option value="" disabled selected>Selecione um Assunto</option>
                            <option value="orcamento">Solicitar Orçamento</option>
                            <option value="duvida">Dúvida ou sugestão</option>
                            <option value="parceria">proposta de parceria</option>
                            <option value="outro">Outros Assuntos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui sua mensagem..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Enviar Mensagem</button>
                </form>
            </div>
        </section>
    </header>
</body>
